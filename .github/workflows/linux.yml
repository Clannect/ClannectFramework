# Linux CI: the sanitizers and fuzzing that MinGW cannot run
# (docs/decisions/0005, 0011). Every job builds with warnings as errors.

name: linux

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.preset }} (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: debug, compiler: g++ }
          - { preset: release, compiler: g++ }
          - { preset: debug, compiler: clang++ }
          # ASan + UBSan + LSan: a single leak or UB report fails the job.
          - { preset: asan, compiler: g++ }
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --preset ${{ matrix.preset }}

  tsan:
    name: tsan (cfw-net)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      # TSan's shadow memory layout does not fit the runner kernel's default
      # 32-bit mmap randomisation.
      - name: Reduce ASLR entropy for TSan
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: cmake --preset tsan
      - name: Build
        run: cmake --build --preset tsan
      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --preset tsan -L cfw-net

  windows-cross:
    name: windows (MinGW-w64 GCC 13, tests under Wine)
    runs-on: ubuntu-24.04
    env:
      WINEPREFIX: ${{ github.workspace }}/.wine
      WINEDEBUG: -all
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-mingw-w64-x86-64-posix wine64 wine
      - name: Initialise Wine
        run: wineboot -i
      - name: Configure
        run: >
          cmake -S . -B build/windows -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/mingw-w64-cross.cmake
      - name: Build
        run: cmake --build build/windows
      - name: Test (Windows binaries under Wine)
        run: ctest --test-dir build/windows --output-on-failure --timeout 120
      # Schannel (Windows build) against the OpenSSL backend (native build):
      # the only place the Schannel client runs outside a Windows machine.
      - name: Build the native TLS echo server
        run: |
          cmake --preset debug
          cmake --build --preset debug --target TlsEchoServer
      - name: TLS interop (Schannel client, OpenSSL server)
        run: |
          build/debug/testing/tls-interop/TlsEchoServer info.txt &
          for i in $(seq 1 20); do [ -s info.txt ] && break; sleep 0.5; done
          wine build/windows/testing/tls-interop/SchannelClient.exe info.txt

  fuzz:
    name: fuzz (libFuzzer, 45 s per target)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18 libclang-rt-18-dev
      - name: Configure
        run: cmake --preset fuzz -DCMAKE_CXX_COMPILER=clang++-18
      - name: Build
        run: cmake --build --preset fuzz
      - name: Unit tests and corpus replay (Clang + ASan/UBSan)
        run: ctest --preset fuzz
      - name: Fuzz
        run: |
          mkdir -p fuzz-artifacts
          status=0
          for target in FuzzJson FuzzByteReader FuzzUrl FuzzWebSocketFrames FuzzHttp \
              FuzzInflate FuzzPng FuzzJpeg FuzzWebP FuzzPaint FuzzText FuzzFont FuzzShape; do
            mkdir -p "new-corpus/$target"
            echo "::group::$target"
            if ! build/fuzz/fuzz/$target "new-corpus/$target" "fuzz/corpus/$target" \
                -max_total_time=45 -max_len=4096 -timeout=10 -rss_limit_mb=2048 \
                -artifact_prefix="fuzz-artifacts/$target-"; then
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz-artifacts/
